<!DOCTYPE html>
<title>Quant Prep Ledgers</title>
<style>
:root{
  --bg:#f6f7f9; --ink:#171b24; --muted:#5a6273; --rule:#d9dee6; --card:#ffffff;
  --accent:#2346a0; --gap:#8a4b00; --gapbg:#fdf1de; --idea:#eef2fb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1218; --ink:#e4e7ee; --muted:#98a1b3; --rule:#283042; --card:#161a22;
    --accent:#93abff; --gap:#f0b35a; --gapbg:#2a2010; --idea:#1a2033;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1218; --ink:#e4e7ee; --muted:#98a1b3; --rule:#283042; --card:#161a22;
  --accent:#93abff; --gap:#f0b35a; --gapbg:#2a2010; --idea:#1a2033;
}
body{background:var(--bg);color:var(--ink);font:20px/1.75 "MesloLGS Nerd Font Propo","MesloLGS NF","MesloLGS Nerd Font",ui-monospace,monospace;padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:52rem;margin:0 auto}
h1,h2,h3{font-family:"MesloLGS Nerd Font Propo","MesloLGS NF","MesloLGS Nerd Font",ui-monospace,monospace;font-weight:700;text-wrap:balance;line-height:1.2}
h1{font-size:2.4rem;margin:0 0 .25rem}
h2{font-size:1.7rem;margin:3rem 0 .75rem;padding-top:1rem;border-top:1px solid var(--rule)}
h3{font-size:1.2rem;margin:0 0 .4rem}
.sub{color:var(--muted);margin:0 0 1.25rem}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
button{font:inherit;font-size:.9rem;color:var(--accent);background:transparent;border:1px solid var(--rule);border-radius:6px;padding:.3rem .8rem;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.toc{font-size:.92rem;columns:2 14rem;column-gap:2rem;margin:0 0 1rem;padding:0}
nav.toc a{display:block;color:var(--muted);text-decoration:none;padding:.1rem 0;break-inside:avoid}
nav.toc a:hover{color:var(--accent)}
a{color:var(--accent)}
.idea{background:var(--idea);border-radius:8px;padding:.8rem 1rem;margin:.5rem 0 1.25rem}
.idea p,.idea ol,.idea ul{margin:.3rem 0}
.prob{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:1rem 1.1rem;margin:1rem 0}
.prob > p{margin:.2rem 0 .6rem}
.ans{font-weight:600}
details{border-top:1px solid var(--rule);padding:.45rem 0}
summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.95rem}
details > *:not(summary){margin-top:.5rem}
ol.pf{padding-left:1.6rem;margin:.4rem 0}
ol.pf li{margin:.2rem 0}
.why{color:var(--muted);font-size:.85em;white-space:nowrap}
.qed{float:right;color:var(--muted)}
.claim{margin:.3rem 0}
.gap{background:var(--gapbg);color:var(--gap);border-radius:6px;padding:.5rem .8rem;font-size:.92rem}
table{border-collapse:collapse;font-size:.92rem}
.tw{overflow-x:auto}
td,th{border:1px solid var(--rule);padding:.25rem .6rem;text-align:center;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
